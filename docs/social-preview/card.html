<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>TalkingHead social card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <main class="card" aria-label="TalkingHead. Your browser has a mouth now. An avatar says, Is this tab on? Local speech. No API key.">
    <div class="brand" data-safe="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="32" rx="11" fill="currentColor"/>
        <path d="M10 27v12l12-10" fill="currentColor"/>
        <path d="M11 16c3 9 15 9 18 0" fill="none" stroke="#ffe474" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>TalkingHead</span>
    </div>

    <div class="portrait-field" aria-hidden="true"></div>
    <div class="field-ring" aria-hidden="true"></div>

    <h1 class="headline" data-safe="headline">
      <span>Your browser</span>
      <span>has a <span class="mouth">mouth</span></span>
      <span>now.</span>
    </h1>

    <p class="details" data-safe="details">
      <svg viewBox="0 0 33 30" aria-hidden="true">
        <path d="M3 12v6M10 7v16M17 2v26M24 7v16M31 12v6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>Local speech. No API key.</span>
    </p>

    <img class="portrait" src="avatar.png" alt="" width="970" height="1100">

    <div class="speech" data-safe="speech">
      <svg class="speech-shape" viewBox="0 0 330 132" aria-hidden="true">
        <path d="M28 3H301Q327 3 327 29V72Q327 97 301 97H139L108 128L104 97H28Q3 97 3 72V29Q3 3 28 3Z"/>
      </svg>
      <span>Is this tab on?</span>
    </div>
  </main>
</body>
</html>
